<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lazy Farmers — Activate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #ff0000;
            --red-dim: rgba(255, 0, 0, 0.4);
            --red-glow: rgba(255, 0, 0, 0.6);
            --bg: #050000;
            --panel: rgba(10, 0, 0, 0.92);
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Outfit', sans-serif;
        }

        html,
        body {
            min-height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: var(--sans);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.07) 2px,
                    rgba(0, 0, 0, 0.07) 4px);
        }

        .wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 44px 40px 36px;
            background: var(--panel);
            border: 1px solid var(--red-dim);
            position: relative;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
        }

        .card::before,
        .card::after,
        .card .corner-br,
        .card .corner-bl {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--red);
            border-style: solid;
        }

        .card::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .card::after {
            top: -1px;
            right: -1px;
            border-width: 2px 2px 0 0;
        }

        .card .corner-br {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        .card .corner-bl {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 2px 2px;
        }

        .card__title {
            font-family: var(--mono);
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 600;
            color: var(--red);
            text-shadow: 0 0 8px var(--red-glow);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 10px;
        }

        .card__sub {
            font-family: var(--mono);
            font-size: 0.68rem;
            color: rgba(255, 60, 60, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 32px;
        }

        .msg {
            font-family: var(--mono);
            font-size: 0.78rem;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 18px;
            display: none;
        }

        .msg.error {
            color: #ff5555;
            display: block;
        }

        .msg.ok {
            color: #00ff88;
            display: block;
        }

        .field {
            position: relative;
            margin-bottom: 30px;
        }

        .field input {
            width: 100%;
            padding: 14px 0 8px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 0, 0, 0.3);
            color: #fff;
            font-family: var(--sans);
            font-size: 1rem;
            outline: none;
            caret-color: var(--red);
            transition: border-color 0.3s ease;
        }

        .field input#key {
            font-family: var(--mono);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .field label {
            position: absolute;
            left: 0;
            top: 14px;
            font-family: var(--mono);
            font-size: 0.88rem;
            color: rgba(255, 80, 80, 0.6);
            letter-spacing: 1px;
            pointer-events: none;
            transition: top 0.25s ease, font-size 0.25s ease, color 0.25s ease;
        }

        .field input:focus+label,
        .field input:not(:placeholder-shown)+label {
            top: -6px;
            font-size: 0.66rem;
            color: var(--red);
        }

        .field input:focus {
            border-bottom-color: var(--red);
        }

        .field-hint {
            font-family: var(--mono);
            font-size: 0.64rem;
            color: rgba(255, 120, 120, 0.45);
            letter-spacing: 1px;
            margin-top: 6px;
        }

        #activateBtn {
            width: 100%;
            padding: 14px;
            margin-top: 4px;
            background: var(--red);
            color: #fff;
            border: none;
            font-family: var(--mono);
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }

        #activateBtn:hover {
            background: #ff2a2a;
            box-shadow: 0 0 28px rgba(255, 0, 0, 0.6);
        }

        #activateBtn:active {
            transform: scale(0.97);
            background: #c50000;
        }

        .alt-link {
            margin-top: 22px;
            text-align: center;
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 1px;
        }

        .alt-link a {
            color: rgba(255, 80, 80, 0.7);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 0, 0, 0.35);
            padding-bottom: 2px;
        }

        .alt-link a:hover {
            color: var(--red);
        }

        .card.success {
            border-color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.2);
        }

        .card.success::before,
        .card.success::after,
        .card.success .corner-br,
        .card.success .corner-bl {
            border-color: #00ff88;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        .card.shake {
            animation: shake 0.4s ease;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 22px 28px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="card" id="card">
            <span class="corner-br"></span>
            <span class="corner-bl"></span>

            <h1 class="card__title">Activate Access</h1>
            <p class="card__sub" id="sub">Enter your activation key</p>
            <div class="msg" id="msg"></div>

            <form id="activateForm">
                <div class="field">
                    <input type="text" id="key" placeholder=" " required autocomplete="off" spellcheck="false">
                    <label for="key">Activation Key</label>
                    <div class="field-hint" id="keyHint"></div>
                </div>
                <div class="field">
                    <input type="email" id="email" placeholder=" " required autocomplete="email">
                    <label for="email">Email</label>
                </div>
                <div class="field">
                    <input type="password" id="password" placeholder=" " required autocomplete="new-password">
                    <label for="password">Password</label>
                    <div class="field-hint">At least 6 characters</div>
                </div>
                <div class="field">
                    <input type="password" id="confirm" placeholder=" " required autocomplete="new-password">
                    <label for="confirm">Confirm Password</label>
                </div>
                <button type="submit" id="activateBtn">Create Account</button>
            </form>
            <p class="alt-link"><a href="/login">Already have an account? Sign in</a></p>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('activateBtn');
        const keyInput = document.getElementById('key');
        const keyHint = document.getElementById('keyHint');

        function showError(text) {
            msg.textContent = text;
            msg.className = 'msg error';
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
        }

        // the admin's link carries the key, so prefill it and confirm it up front
        const fromLink = new URLSearchParams(window.location.search).get('key');
        if (fromLink) {
            keyInput.value = fromLink;
            checkKey();
        }

        keyInput.addEventListener('blur', checkKey);

        function checkKey() {
            const key = keyInput.value.trim();
            if (!key) return;
            fetch('/api/users/key_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        keyHint.textContent = `Valid key — ${data.days} day${data.days === 1 ? '' : 's'} of access`;
                        keyHint.style.color = 'rgba(0, 255, 136, 0.7)';
                    } else {
                        keyHint.textContent = data.error || 'Key not valid';
                        keyHint.style.color = 'rgba(255, 85, 85, 0.8)';
                    }
                })
                .catch(() => { });
        }

        document.getElementById('activateForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const key = keyInput.value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                showError('Passwords do not match');
                return;
            }

            btn.textContent = 'Activating…';
            btn.style.pointerEvents = 'none';
            msg.className = 'msg';

            fetch('/activate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, email, password, confirm })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        card.classList.add('success');
                        msg.textContent = `Account created — ${data.days_left} days of access`;
                        msg.className = 'msg ok';
                        btn.textContent = 'Access Granted';
                        setTimeout(() => { window.location.href = '/'; }, 1600);
                    } else {
                        btn.textContent = 'Create Account';
                        btn.style.pointerEvents = 'auto';
                        showError(data.error || 'Activation failed');
                    }
                })
                .catch(() => {
                    btn.textContent = 'Create Account';
                    btn.style.pointerEvents = 'auto';
                    showError('Connection Error');
                });
        });
    </script>
</body>

</html>
